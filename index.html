<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리집 배치연구소</title>
<style>
:root{font-family:system-ui,"Noto Sans KR",sans-serif;color:#292c27;background:#f6f5f1}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e8e5de;padding:22px max(18px,calc((100% - 1120px)/2))}h1{font-size:clamp(23px,4vw,32px);margin:0 0 5px}header p{margin:0;color:#777;font-size:14px}main{max-width:1120px;margin:22px auto;padding:0 16px;display:grid;grid-template-columns:330px 1fr;gap:16px}.panel,#workspace{background:#fff;border:1px solid #e7e4dd;border-radius:16px;padding:16px;margin-bottom:14px;min-width:0}h2{font-size:17px;margin:0 0 13px}.hint{font-size:12px;color:#777;line-height:1.55}label{display:block;font-size:13px;color:#555;margin:8px 0}input,button{font:inherit}input{width:100%;padding:9px;border:1px solid #ddd9d0;border-radius:9px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{border:1px solid #ddd9d0;background:#fff;border-radius:9px;padding:9px 11px;cursor:pointer}button.primary{background:#344d3d;color:#fff;border-color:#344d3d}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}#canvasWrap{width:100%;overflow:hidden;border-radius:10px;background:#f3f1eb}canvas{display:block;width:100%;height:auto;touch-action:none}#status{font-size:12px;color:#777;margin:9px 0}#selectedInfo{font-size:13px;color:#555;margin-bottom:8px}#total{font-size:21px;font-weight:750}@media(max-width:760px){main{grid-template-columns:1fr}.side{order:2}#workspace{order:1}}
</style></head><body><header><h1>우리집 배치연구소</h1><p>가구 크기를 직접 입력하고 우리 집에 미리 배치해 보세요.</p></header><main>
<aside class="side">
<section class="panel"><h2>① 우리 집 공간 크기</h2><div class="row"><label>방 가로 (m)<input id="roomW" type="number" min="1" max="20" step=".1" value="4.5"></label><label>방 세로 (m)<input id="roomH" type="number" min="1" max="20" step=".1" value="3.5"></label></div><button class="primary" id="setRoom" style="width:100%">공간 크기 적용</button><p class="hint">방 하나의 가로와 세로 길이를 미터(m) 단위로 입력하세요.</p></section>
<section class="panel"><h2>② 가구 크기 입력</h2><label>가구 이름<input id="newName" maxlength="24" placeholder="예: 4인용 식탁" value="새 가구"></label><div class="row"><label>가로 (cm)<input id="newW" type="number" min="10" max="1500" value="140"></label><label>세로 (cm)<input id="newH" type="number" min="10" max="1500" value="80"></label></div><label>가격 (원, 선택)<input id="newPrice" type="number" min="0" value="0"></label><button class="primary" id="add" style="width:100%">가구 추가하기</button><p class="hint">쇼핑몰에서 확인한 가구의 가로·깊이 크기를 입력하세요. 세로는 바닥에 닿는 깊이입니다.</p></section>
<section class="panel"><h2>③ 선택한 가구 수정</h2><div id="selectedInfo">배치도에서 가구를 선택해 주세요.</div><div class="row"><label>가로 (cm)<input id="editW" type="number" min="10" value="140"></label><label>세로 (cm)<input id="editH" type="number" min="10" value="80"></label></div><label>가구 이름<input id="editName" maxlength="24"></label><label>가격 (원)<input id="editPrice" type="number" min="0" value="0"></label><div class="actions"><button id="apply">수정 적용</button><button id="rotate">90° 회전</button><button id="duplicate">복제</button><button id="delete">삭제</button></div></section>
</aside>
<section id="workspace"><h2>④ 우리 집 가구 배치도</h2><div id="canvasWrap"><canvas id="floor" width="900" height="650" aria-label="가구 배치 작업 공간"></canvas></div><div id="status">가구를 눌러 선택하고 끌어서 이동하세요.</div><div class="actions"><button id="clear">가구 모두 비우기</button><button class="primary" id="save">배치도 이미지 저장</button></div><section class="panel" style="margin-top:14px;margin-bottom:0"><h2>⑤ 예상 구매 금액</h2><div id="summary" class="hint">배치된 가구 0개</div><div id="total">0원</div></section></section></main>
<script>(()=>{const $=id=>document.getElementById(id),canvas=$('floor'),ctx=canvas.getContext('2d');let roomW=4.5,roomH=3.5,items=[],selected=-1,scale=1,ox=0,oy=0,drag=null;
function geometry(){const pad=42;scale=Math.min((canvas.width-pad*2)/(roomW*100),(canvas.height-pad*2)/(roomH*100));ox=(canvas.width-roomW*100*scale)/2;oy=(canvas.height-roomH*100*scale)/2}
function clamp(it){const w=it.rot?it.h:it.w,h=it.rot?it.w:it.h;it.x=Math.max(0,Math.min(it.x,Math.max(0,roomW*100-w)));it.y=Math.max(0,Math.min(it.y,Math.max(0,roomH*100-h)))}
function update(){$('selectedInfo').textContent=selected<0?'배치도에서 가구를 선택해 주세요.':items[selected].name+' 선택됨';if(selected>=0){let it=items[selected];$('editW').value=it.w;$('editH').value=it.h;$('editName').value=it.name;$('editPrice').value=it.price}$('summary').textContent='배치된 가구 '+items.length+'개';$('total').textContent=items.reduce((s,x)=>s+x.price,0).toLocaleString('ko-KR')+'원'}
function draw(){geometry();ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#f3f1eb';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff';ctx.fillRect(ox,oy,roomW*100*scale,roomH*100*scale);ctx.strokeStyle='#e8e3da';ctx.lineWidth=1;for(let x=0;x<=roomW*100;x+=50){ctx.beginPath();ctx.moveTo(ox+x*scale,oy);ctx.lineTo(ox+x*scale,oy+roomH*100*scale);ctx.stroke()}for(let y=0;y<=roomH*100;y+=50){ctx.beginPath();ctx.moveTo(ox,oy+y*scale);ctx.lineTo(ox+roomW*100*scale,oy+y*scale);ctx.stroke()}ctx.strokeStyle='#4b554d';ctx.lineWidth=4;ctx.strokeRect(ox,oy,roomW*100*scale,roomH*100*scale);items.forEach((it,i)=>{let w=it.rot?it.h:it.w,h=it.rot?it.w:it.h,x=ox+it.x*scale,y=oy+it.y*scale;ctx.fillStyle=it.color;ctx.strokeStyle=i===selected?'#244f9a':'#655f55';ctx.lineWidth=i===selected?4:2;ctx.beginPath();ctx.roundRect(x,y,w*scale,h*scale,7);ctx.fill();ctx.stroke();ctx.fillStyle='#292820';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 16px sans-serif';ctx.fillText(it.name.length>14?it.name.slice(0,13)+'…':it.name,x+w*scale/2,y+h*scale/2);ctx.font='12px sans-serif';ctx.fillText(w+'×'+h+'cm',x+w*scale/2,y+h*scale/2+20)});ctx.fillStyle='#5d5a54';ctx.font='14px sans-serif';ctx.textAlign='center';ctx.fillText(roomW+'m',ox+roomW*100*scale/2,oy-14);ctx.save();ctx.translate(ox-16,oy+roomH*100*scale/2);ctx.rotate(-Math.PI/2);ctx.fillText(roomH+'m',0,0);ctx.restore();update()}
$('setRoom').onclick=()=>{let w=+$('roomW').value,h=+$('roomH').value;if(w<1||h<1||w>20||h>20){alert('방 크기는 1~20m로 입력해 주세요.');return}roomW=w;roomH=h;items.forEach(clamp);draw()};
$('add').onclick=()=>{let w=+$('newW').value,h=+$('newH').value,p=+$('newPrice').value,name=$('newName').value.trim()||'새 가구';if(w<10||h<10||w>1500||h>1500||p<0){alert('가구 크기와 가격을 확인해 주세요.');return}if(w>roomW*100||h>roomH*100){if(!confirm('가구가 방보다 큽니다. 그래도 추가할까요?'))return}items.push({name,w,h,price:p,x:Math.max(0,(roomW*100-w)/2),y:Math.max(0,(roomH*100-h)/2),rot:false,color:['#c9b8a6','#b9b4c9','#c8a77e','#b6c2b2','#d0b2a5'][items.length%5]});selected=items.length-1;draw()};
function point(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
canvas.onpointerdown=e=>{let p=point(e);selected=-1;for(let i=items.length-1;i>=0;i--){let it=items[i],w=it.rot?it.h:it.w,h=it.rot?it.w:it.h,x=ox+it.x*scale,y=oy+it.y*scale;if(p.x>=x&&p.x<=x+w*scale&&p.y>=y&&p.y<=y+h*scale){selected=i;drag={dx:(p.x-x)/scale,dy:(p.y-y)/scale};break}}canvas.setPointerCapture(e.pointerId);draw()};
canvas.onpointermove=e=>{if(!drag||selected<0)return;let p=point(e),it=items[selected],w=it.rot?it.h:it.w,h=it.rot?it.w:it.h;it.x=Math.max(0,Math.min(roomW*100-w,(p.x-ox)/scale-drag.dx));it.y=Math.max(0,Math.min(roomH*100-h,(p.y-oy)/scale-drag.dy));draw()};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
$('apply').onclick=()=>{if(selected<0){alert('먼저 가구를 선택해 주세요.');return}let w=+$('editW').value,h=+$('editH').value,p=+$('editPrice').value;if(w<10||h<10||w>1500||h>1500||p<0){alert('가구 크기와 가격을 확인해 주세요.');return}let it=items[selected];it.w=w;it.h=h;it.price=p;it.name=$('editName').value.trim()||'새 가구';clamp(it);draw()};
$('rotate').onclick=()=>{if(selected>=0){items[selected].rot=!items[selected].rot;clamp(items[selected]);draw()}};$('duplicate').onclick=()=>{if(selected>=0){let it={...items[selected],x:items[selected].x+15,y:items[selected].y+15};clamp(it);items.push(it);selected=items.length-1;draw()}};$('delete').onclick=()=>{if(selected>=0){items.splice(selected,1);selected=-1;draw()}};$('clear').onclick=()=>{if(confirm('배치한 가구를 모두 지울까요?')){items=[];selected=-1;draw()}};$('save').onclick=()=>{draw();let a=document.createElement('a');a.download='우리집-가구배치.png';a.href=canvas.toDataURL('image/png');a.click()};draw()})();</script></body></html>
